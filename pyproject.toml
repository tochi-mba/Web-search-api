[project]
name = "web-search-api"
version = "0.1.0"
description = "FastAPI service that scrapes Google search results and web pages, then synthesises executive summaries with any of ~60 LLM providers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "selectolax>=0.3.21",
    "playwright>=1.48",
    "anthropic>=0.40",
    "openai>=1.55",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.1",
    "keyring-client",
    "settings-client",
]

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- #
# Lint / format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "A",      # builtin shadowing
    "ANN",    # missing annotations
    "ARG",    # unused arguments
    "ASYNC",  # async correctness
    "B",      # bugbear
    "C4",     # comprehensions
    "DTZ",    # naive datetimes
    "E",      # pycodestyle errors
    "EM",     # exception message hygiene
    "ERA",    # commented-out code
    "F",      # pyflakes
    "FA",     # future annotations
    "I",      # import sorting
    "ICN",    # import conventions
    "N",      # pep8-naming
    "PERF",   # performance anti-patterns
    "PIE",
    "PL",     # pylint subset
    "PT",     # pytest style
    "PTH",    # use pathlib
    "RET",    # return hygiene
    "RSE",
    "RUF",
    "S",      # bandit
    "SIM",    # simplify
    "SLF",    # private member access
    "T20",    # no print
    "TC",     # typing-only imports
    "TID",    # tidy imports
    "TRY",    # exception hygiene
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "ANN401",  # Any is occasionally the honest annotation
    "TRY003",  # long messages inline are clearer than an exception subclass per message
    # The families below fire well over 150 times on this codebase (DomainError
    # constructed with a string, FastAPI/runtime annotations, lazy provider
    # imports, magic numbers in timeouts and status codes). Aligning them is a
    # dedicated pass, not this one.
    "EM101",
    "EM102",
    "TC001",
    "TC002",
    "TC003",
    "PLR0911",
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "S105",    # test tokens are fixtures, not leaked secrets
    "S106",
    "S104",    # asserting on "0.0.0.0" is not binding to it
    "ANN",     # annotations add noise to fixtures and helpers
    "T20",
    "SLF001",  # tests may inspect private state
    "ARG001",  # fakes and handlers mirror signatures they do not all use
    "ARG002",
    "ARG005",
    "PLW0108", # FastAPI overrides are zero-arg callables, not inlined values
]
"scripts/*" = ["T20"]
# The "Problem" suffix is deliberate: ValidationError and TimeoutError are
# already taken by pydantic and asyncio, and shadowing them invites bugs.
"app/core/errors.py" = ["N818"]
# FastAPI resolves handler annotations at runtime to build the dependency graph
# and the OpenAPI schema, so its type-only-looking imports must stay importable.
"app/api/routes/*" = ["TC001", "TC002", "TC003"]
"app/api/deps.py" = ["TC001", "TC002", "TC003"]
"app/schemas/*" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------- #
# Types
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["selectolax.*", "playwright.*"]
ignore_missing_imports = true

# Media-tool types tests strictly. Doing the same here is 1,200+ missing
# annotations on fixtures and helpers; that is a dedicated pass, not this one.
# Tests stay type-checked for the calls they make.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false

# --------------------------------------------------------------------------- #
# Tests
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "browser: tests that launch a real headless Chromium against a local fixture server",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.uv.sources]
keyring-client = { git = "https://github.com/tochi-mba/Keyring-api", subdirectory = "clients/python", tag = "keyring-client-v0.1.0" }
settings-client = { git = "https://github.com/tochi-mba/Settings-api", subdirectory = "clients/python", tag = "settings-client-v0.1.0" }

# --------------------------------------------------------------------------- #
# Architecture (layering is enforced, not merely documented)
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Services do not import the API layer"
type = "forbidden"
source_modules = [
    "app.services",
    "app.core",
    "app.config",
    "app.constants",
    "app.schemas",
    "app.bootstrap",
]
forbidden_modules = ["app.api"]
# app.main is the factory: it is the one module allowed to import routes.

[[tool.importlinter.contracts]]
name = "Keyring is spoken to from one package"
type = "forbidden"
source_modules = [
    "app.api",
    "app.core",
    "app.constants",
    "app.schemas",
    "app.services.search",
    "app.services.llm",
    "app.services.jobs",
    "app.services.text",
    "app.services.fetch",
    "app.services.preferences",
    "app.services.robots",
    "app.services.urlsafety",
    "app.services.pipelines",
]
forbidden_modules = ["keyring_client", "jwt"]
# app.services.keyring is the one package that talks to keyring. app.config is
# left off on purpose: it validates the service token and the audience with the
# rules keyring enforces, rather than with a copy of them that could drift.
# app.bootstrap and app.main are the composition root and may construct a
# verifier; they currently go through app.services.keyring instead.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Settings-api is spoken to from one module"
type = "forbidden"
source_modules = [
    "app.api",
    "app.core",
    "app.config",
    "app.constants",
    "app.schemas",
    "app.services.search",
    "app.services.llm",
    "app.services.jobs",
    "app.services.text",
    "app.services.fetch",
    "app.services.keyring",
    "app.services.robots",
    "app.services.urlsafety",
    "app.services.pipelines",
]
forbidden_modules = ["settings_client"]
# app.services.preferences is the one module that reads settings-api.
# app.bootstrap and app.main are the composition root and may construct the
# client; they currently go through build_preference_source instead.
# app.config validates the token with keyring_client.check_service_token.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Playwright stays behind the browser adapter"
type = "forbidden"
source_modules = [
    "app.api",
    "app.core",
    "app.config",
    "app.constants",
    "app.schemas",
    "app.main",
    "app.bootstrap",
    "app.services.search",
    "app.services.llm",
    "app.services.jobs",
    "app.services.keyring",
    "app.services.text",
    "app.services.preferences",
    "app.services.robots",
    "app.services.urlsafety",
    "app.services.pipelines",
    "app.services.fetch.http",
    "app.services.fetch.page",
]
forbidden_modules = ["playwright"]
# The page fetcher constructs the browser adapter, so it imports that module --
# but it still must not reach Playwright itself, which is what this asserts.
allow_indirect_imports = true
